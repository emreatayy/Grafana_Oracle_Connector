apiVersion: 1

# Dev datasource pointing at the §17.1 matrix Oracle 21c (compose-internal
# network, so the grafana12/grafana13 containers reach it via the service
# name). Requires: docker compose --profile oracle21 up -d oracle21
datasources:
  - name: 'oracle-datasource'
    type: 'emreatayy-oracle-datasource'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    jsonData:
      o_hostname: 'oracle21'
      o_port: 1521
      o_service: 'XEPDB1'
      o_user: 'SYSTEM'
      sessionTimeZone: 'UTC'
    secureJsonData:
      o_password: 'verif_password'
