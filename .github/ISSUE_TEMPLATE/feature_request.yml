name: Feature request
description: Suggest a feature for the plugin or the project
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. This project is design-first: features
        are specified in the design report before code. Please include enough
        context that the maintainer can decide where it fits (or whether it
        contradicts an existing ADR).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What does the plugin currently not allow you to do? What is the use case?
      placeholder: "I need to stop a DBMS_SCHEDULER job from the dashboard without opening SQL*Plus."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should the feature behave? Describe the UX and the expected behavior.
      placeholder: "A 'Run command' button in the query editor that executes an allowlisted BEGIN…END block."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any workarounds or alternative designs you considered.
      placeholder: "A separate scheduler-job management panel; or server-side REST endpoint."
  - type: textarea
    id: report-ref
    attributes:
      label: Related report section / ADR (optional)
      description: Does this extend or conflict with an existing section of the design report (§12 command execution, §8 macros, …)?
      placeholder: "Extends §12 — command execution allowlist could include scheduler start/stop."
  - type: checkboxes
    id: terms
    attributes:
      label: Scope
      options:
        - label: I understand this project is design-first and the feature will be specified in the report before implementation.
          required: true
