name: Bug report
description: Report a bug in the plugin or the verification harness
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. Please search
        existing issues first to avoid duplicates.
  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: When I run this query with $__timeFilter, the panel is empty…
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal reproduction steps, including the SQL / configuration involved.
      placeholder: |
        1. Configure a datasource to ...
        2. Run query ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include the exact error message (no credentials).
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions and topology that matter.
      placeholder: |
        - Grafana version: 12.4.x
        - Oracle version: 21c XE (or 19c / 23ai)
        - Plugin version / commit: main@<sha>
        - OS of the Grafana server: Linux / macOS / Windows
    validations:
      required: true
  - type: textarea
    id: report-ref
    attributes:
      label: Related report section (optional)
      description: If the bug relates to a design assumption, cite the report section / ADR (§6, §8, ADR-9, …) and any verification-harness output.
      placeholder: "§8.2 macro expansion — $__timeFilter result differs from the report."
  - type: checkboxes
    id: terms
    attributes:
      label: Security
      options:
        - label: I have NOT included any passwords, connection strings, or signing keys in this report.
          required: true
